services:
  # ───── 基础设施 ─────
  mysql:
    image: mysql:8.0
    container_name: codivio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: codivio123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcodivio123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - codivio-network

  redis:
    image: redis:7-alpine
    container_name: codivio-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - codivio-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: codivio-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: codivio
      RABBITMQ_DEFAULT_PASS: codivio123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - codivio-network

  # ───── 后端服务 ─────
  user-service:
    build:
      context: ./backend/user-service
      dockerfile: Dockerfile
    container_name: codivio-user-service
    ports:
      - "8081:8081"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - codivio-network

  project-service:
    build:
      context: ./backend/project-service
      dockerfile: Dockerfile
    container_name: codivio-project-service
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - codivio-network

  collaboration-service:
    build:
      context: ./backend/collaboration-service
      dockerfile: Dockerfile
    container_name: codivio-collaboration-service
    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - codivio-network

  file-service:
    build:
      context: ./backend/file-service
      dockerfile: Dockerfile
    container_name: codivio-file-service
    ports:
      - "8084:8084"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      user-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - ./data/files:/app/files
    networks:
      - codivio-network

  gateway-service:
    build:
      context: ./backend/gateway-service
      dockerfile: Dockerfile
    container_name: codivio-gateway-service
    ports:
      - "8080:8080"
    depends_on:
      user-service:
        condition: service_healthy
      project-service:
        condition: service_healthy
      file-service:
        condition: service_healthy
      collaboration-service:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - codivio-network

  # ───── 前端 ─────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codivio-frontend
    ports:
      - "80:80"
    depends_on:
      - gateway-service
    networks:
      - codivio-network

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:

networks:
  codivio-network:
    driver: bridge
