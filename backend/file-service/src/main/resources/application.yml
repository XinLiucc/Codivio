server:
  port: 8084

spring:
  application:
    name: file-service
  
  # 数据源配置 - 使用文件服务专用数据库
  datasource:
    url: jdbc:mysql://codivio-mysql:3306/codivio_file?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: codivio
    password: codivio123
    driver-class-name: com.mysql.cj.jdbc.Driver
    
    # HikariCP连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  
  # JPA配置
  jpa:
    hibernate:
      ddl-auto: update  # 开发环境自动创建/更新表结构
    show-sql: true      # 文件服务显示SQL便于调试
    properties:
      hibernate:
        format_sql: true
  
  # RabbitMQ配置
  rabbitmq:
    host: codivio-rabbitmq
    port: 5672
    username: codivio
    password: codivio123
    virtual-host: /codivio
    
    # 生产者配置
    publisher-confirm-type: correlated  # 启用确认机制
    publisher-returns: true             # 启用返回机制
    template:
      mandatory: true                   # 强制路由
      
    # 消费者配置
    listener:
      simple:
        acknowledge-mode: manual        # 手动确认
        retry:
          enabled: true
          initial-interval: 1000ms
          max-attempts: 3
          multiplier: 2.0
        default-requeue-rejected: false
  
  # 文件上传配置
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# 日志配置
logging:
  level:
    com.codivio.file: INFO

