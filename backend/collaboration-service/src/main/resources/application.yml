server:
  port: 8083

spring:
  application:
    name: collaboration-service
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

jwt:
  secret: codivio-jwt-secret-key-2025-very-long-and-secure-string

logging:
  level:
    com.codivio.collaboration: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
