# Docker环境配置
spring:
  # 完全禁用Spring Boot Actuator的系统指标
  autoconfigure:
    exclude: 
      - org.springframework.boot.actuate.autoconfigure.metrics.SystemMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.JvmMetricsAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.metrics.web.tomcat.TomcatMetricsAutoConfiguration
  
  cloud:
    gateway:
      routes:
        # 用户服务路由
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        # 项目服务路由
        - id: project-service
          uri: http://project-service:8082
          predicates:
            - Path=/api/v1/projects/**
        # 协作服务路由
        - id: collaboration-service
          uri: http://collaboration-service:8083
          predicates:
            - Path=/api/v1/collaboration/**
        # 文件服务路由
        - id: file-service
          uri: http://file-service:8084
          predicates:
            - Path=/api/v1/files/**

# 日志配置 - Docker环境
logging:
  level:
    com.codivio.gateway: INFO
    org.springframework.cloud.gateway: WARN

# 管理端点配置 - 完全禁用指标自动配置
management:
  endpoints:
    web:
      exposure:
        include: health
  metrics:
    enabled: false
    enable:
      process: false
      system: false
      jvm: false
      tomcat: false
      web: false
    export:
      defaults:
        enabled: false

# 服务地址配置 - Docker环境
services:
  user-service:
    url: http://user-service:8081